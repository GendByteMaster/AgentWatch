name: Run Details Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/run-details-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add run details panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/dashboard.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match, got {text.count(old)} for:\n{old[:120]}")
              text = text.replace(old, new, 1)

          replace_once(
              "    collections::BTreeMap,\n",
              "    collections::{BTreeMap, BTreeSet},\n",
          )

          replace_once(
              '''struct AgentRun {
              id: String,
              provider: String,
              command: String,
              started: DateTime<Utc>,
              status: RunStatus,
              duration_ms: Option<u64>,
          }''',
              '''struct AgentRun {
              id: String,
              provider: String,
              model: Option<String>,
              command: String,
              started: DateTime<Utc>,
              ended_at: Option<DateTime<Utc>>,
              status: RunStatus,
              duration_ms: Option<u64>,
              exit_code: Option<i32>,
              risk: Option<String>,
          }''',
          )

          replace_once(
              '''        let run = runs.entry(id.clone()).or_insert_with(|| AgentRun {
              id,
              provider: event.provider.clone().unwrap_or_else(|| "agent".into()),
              command: event.command.clone().unwrap_or_default(),
              started: event.timestamp,
              status: RunStatus::Running,
              duration_ms: None,
          });

          match event.kind.as_str() {
              "agent.started" => {
                  run.started = event.timestamp;
                  run.provider = event
                      .provider
                      .clone()
                      .unwrap_or_else(|| run.provider.clone());
                  run.command = event.command.clone().unwrap_or_else(|| run.command.clone());
              }
              "agent.failed" => {
                  run.status = RunStatus::Failed;
                  run.duration_ms = event.duration_ms;
              }
              "agent.completed" | "agent" => {
                  run.status = if event.exit_code.is_some_and(|code| code != 0) {
                      RunStatus::Failed
                  } else {
                      RunStatus::Completed
                  };
                  run.duration_ms = event.duration_ms;
              }
              _ => {}
          }''',
              '''        let run = runs.entry(id.clone()).or_insert_with(|| AgentRun {
              id,
              provider: event.provider.clone().unwrap_or_else(|| "agent".into()),
              model: event.model.clone(),
              command: event.command.clone().unwrap_or_default(),
              started: event.timestamp,
              ended_at: None,
              status: RunStatus::Running,
              duration_ms: None,
              exit_code: None,
              risk: event.risk.clone(),
          });

          if let Some(provider) = &event.provider {
              run.provider = provider.clone();
          }
          if let Some(model) = &event.model {
              run.model = Some(model.clone());
          }
          if let Some(command) = &event.command {
              run.command = command.clone();
          }
          if let Some(risk) = &event.risk {
              run.risk = Some(risk.clone());
          }

          match event.kind.as_str() {
              "agent.started" => {
                  run.started = event.timestamp;
              }
              "agent.failed" => {
                  run.status = RunStatus::Failed;
                  run.ended_at = Some(event.timestamp);
                  run.duration_ms = event.duration_ms;
                  run.exit_code = event.exit_code;
              }
              "agent.completed" | "agent" => {
                  run.status = if event.exit_code.is_some_and(|code| code != 0) {
                      RunStatus::Failed
                  } else {
                      RunStatus::Completed
                  };
                  run.ended_at = Some(event.timestamp);
                  run.duration_ms = event.duration_ms;
                  run.exit_code = event.exit_code;
              }
              _ => {}
          }''',
          )

          replace_once(
              '''fn selected_run_id<'a>(data: &'a Data, ui: &UiState) -> Option<&'a str> {
              data.runs.get(ui.selected_run).map(|run| run.id.as_str())
          }''',
              '''fn selected_run<'a>(data: &'a Data, ui: &UiState) -> Option<&'a AgentRun> {
              data.runs.get(ui.selected_run)
          }

          fn selected_run_id<'a>(data: &'a Data, ui: &UiState) -> Option<&'a str> {
              selected_run(data, ui).map(|run| run.id.as_str())
          }''',
          )

          old_body = '''fn body(frame: &mut Frame, area: Rect, data: &Data, ui: &UiState) {
              let rows = Layout::default()
                  .direction(Direction::Vertical)
                  .constraints([
                      Constraint::Percentage(50),
                      Constraint::Percentage(30),
                      Constraint::Percentage(20),
                  ])
                  .split(area);
              let top = split(rows[0]);
              let middle = split(rows[1]);
              let bottom = split(rows[2]);

              agents(frame, top[0], data, ui);
              files(frame, top[1], data);
              recent(frame, middle[0], data, ui);
              tests(frame, middle[1], data);
              tail(frame, bottom[0], data, ui);
              session(frame, bottom[1], data);
          }'''
          new_body = '''fn body(frame: &mut Frame, area: Rect, data: &Data, ui: &UiState) {
              let columns = split(area);
              let left = Layout::default()
                  .direction(Direction::Vertical)
                  .constraints([
                      Constraint::Percentage(45),
                      Constraint::Percentage(25),
                      Constraint::Percentage(30),
                  ])
                  .split(columns[0]);
              let right = Layout::default()
                  .direction(Direction::Vertical)
                  .constraints([Constraint::Percentage(38), Constraint::Percentage(62)])
                  .split(columns[1]);

              agents(frame, left[0], data, ui);
              recent(frame, left[1], data, ui);
              tail(frame, left[2], data, ui);
              files(frame, right[0], data);
              run_details(frame, right[1], data, ui);
          }'''
          replace_once(old_body, new_body)

          start = text.index("fn tests(")
          end = text.index("fn tail(", start)
          text = text[:start] + text[end:]

          start = text.index("fn session(")
          end = text.index("fn footer(", start)
          details = '''fn run_details(frame: &mut Frame, area: Rect, data: &Data, ui: &UiState) {
              let Some(run) = selected_run(data, ui) else {
                  let state = data.meta.root.join(".agentwatch");
                  let size: u64 = fs::read_dir(state)
                      .ok()
                      .into_iter()
                      .flatten()
                      .filter_map(|entry| entry.ok())
                      .filter_map(|entry| entry.metadata().ok())
                      .filter(|meta| meta.is_file())
                      .map(|meta| meta.len())
                      .sum();
                  frame.render_widget(
                      Paragraph::new(vec![
                          Line::styled(
                              "No agent run selected yet",
                              Style::default().fg(Color::DarkGray),
                          ),
                          Line::raw(format!("Events: {}", data.events.len())),
                          Line::raw(format!("Output: {}", data.output.len())),
                          Line::raw(format!("Storage: {}", bytes(size))),
                          Line::raw(format!("Session: {}", data.meta.started_at.format("%H:%M:%S"))),
                          Line::raw(format!("Path: {}", data.meta.root.display())),
                      ])
                      .block(Block::default().title("Run Details").borders(Borders::ALL))
                      .wrap(Wrap { trim: false }),
                      area,
                  );
                  return;
              };

              let end = run.ended_at.unwrap_or_else(Utc::now);
              let observed_files: BTreeSet<_> = data
                  .events
                  .iter()
                  .filter(|event| event.timestamp >= run.started && event.timestamp <= end)
                  .filter_map(|event| event.path.as_ref())
                  .collect();
              let (status, status_style) = match run.status {
                  RunStatus::Running => ("running", Style::default().fg(Color::Green)),
                  RunStatus::Completed => ("completed", Style::default().fg(Color::Green)),
                  RunStatus::Failed => ("failed", Style::default().fg(Color::Red)),
              };
              let policy = run.risk.as_deref().unwrap_or("allow");
              let policy_style = if policy.starts_with("deny") {
                  Style::default().fg(Color::Red)
              } else if policy.starts_with("warn") {
                  Style::default().fg(Color::Yellow)
              } else {
                  Style::default().fg(Color::Green)
              };
              let ended = run
                  .ended_at
                  .map(|value| value.format("%H:%M:%S").to_string())
                  .unwrap_or_else(|| "running".to_owned());
              let elapsed = run
                  .duration_ms
                  .map(duration)
                  .unwrap_or_else(|| live_duration(run.started));
              let exit = run
                  .exit_code
                  .map(|code| code.to_string())
                  .unwrap_or_else(|| "-".to_owned());

              let mut lines = vec![
                  Line::raw(format!("Run ID: {}", run.id)),
                  Line::raw(format!("Provider: {}", run.provider)),
                  Line::raw(format!("Model: {}", run.model.as_deref().unwrap_or("-"))),
                  Line::from(vec![Span::raw("Status: "), Span::styled(status, status_style)]),
                  Line::raw(format!("Started: {}", run.started.format("%H:%M:%S"))),
                  Line::raw(format!("Ended: {ended}")),
                  Line::raw(format!("Duration: {elapsed}")),
                  Line::raw(format!("Exit code: {exit}")),
                  Line::from(vec![Span::raw("Policy: "), Span::styled(policy, policy_style)]),
                  Line::raw(format!("Command: {}", run.command)),
                  Line::raw(""),
                  Line::styled(
                      "Observed files (time window)",
                      Style::default().fg(Color::DarkGray),
                  ),
              ];

              let file_limit = area.height.saturating_sub(15) as usize;
              if observed_files.is_empty() {
                  lines.push(Line::styled(
                      "  none recorded (watcher may be inactive)",
                      Style::default().fg(Color::DarkGray),
                  ));
              } else {
                  for path in observed_files.iter().take(file_limit) {
                      lines.push(Line::raw(format!("  {}", path.display())));
                  }
                  if observed_files.len() > file_limit {
                      lines.push(Line::styled(
                          format!("  +{} more", observed_files.len() - file_limit),
                          Style::default().fg(Color::DarkGray),
                      ));
                  }
              }

              frame.render_widget(
                  Paragraph::new(lines)
                      .block(Block::default().title("Run Details").borders(Borders::ALL))
                      .wrap(Wrap { trim: false }),
                  area,
              );
          }

          '''
          text = text[:start] + details + text[end:]
          path.write_text(text)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old = "- session event/output counts and storage size\n"
          new = "- selected run details: model, exact command, timing, exit code, policy risk, and observed files\n"
          if old not in readme:
              raise SystemExit("README TUI bullet not found")
          readme = readme.replace(old, new, 1)
          marker = "The selected agent run is highlighted, and the output panel filters to that run by default. You can switch the output panel back to all runs at any time.\n"
          addition = marker + "\nThe `Run Details` panel follows the selected run. File attribution is currently time-window based (`agent.started` through its terminal event), so it is labeled as observed rather than exact when multiple writers are active.\n"
          if marker not in readme:
              raise SystemExit("README interaction paragraph not found")
          readme = readme.replace(marker, addition, 1)
          readme_path.write_text(readme)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Apply Clippy fixes
        run: cargo clippy --fix --all-targets --all-features --allow-dirty --allow-staged -- -D warnings

      - name: Format after fixes
        run: cargo fmt --all

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard.rs README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(tui): add selected run details panel"
          git push
