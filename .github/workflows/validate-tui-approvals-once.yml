name: Validate TUI Approvals Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/validate-tui-approvals-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Patch and validate
        shell: bash
        run: |
          set +e
          LOG=/tmp/tui-approvals.log
          : > "$LOG"

          run_step() {
            echo "" | tee -a "$LOG"
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            return ${PIPESTATUS[0]}
          }

          run_step "Patch" python .github/patch_tui_approvals.py
          RC=$?
          if [ "$RC" -eq 0 ]; then run_step "Format" cargo fmt --all; RC=$?; fi
          if [ "$RC" -eq 0 ]; then run_step "Check" cargo check --all-targets --all-features; RC=$?; fi
          if [ "$RC" -eq 0 ]; then run_step "Clippy" cargo clippy --all-targets --all-features -- -D warnings; RC=$?; fi
          if [ "$RC" -eq 0 ]; then run_step "Test" cargo test --all-targets --all-features; RC=$?; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$RC" -ne 0 ]; then
            cp "$LOG" .github/tui-approvals-validation.log
            git add .github/tui-approvals-validation.log
            git commit -m "ci: capture TUI approval validation failure" || true
            git push || true
            exit "$RC"
          fi

          git add src README.md Cargo.lock
          git commit -m "feat(tui): add interactive approval gate" || true
          git push
