name: Fix Clippy Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-clippy-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply targeted Clippy fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dashboard.rs')
          text = path.read_text()
          old = '    runs.sort_by(|a, b| b.started.cmp(&a.started));\n'
          new = '    runs.sort_by_key(|run| std::cmp::Reverse(run.started));\n'
          if old not in text:
              raise SystemExit('target sort_by line not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets --all-features

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard.rs
          git commit -m "fix(tui): satisfy clippy sort lint"
          git push
