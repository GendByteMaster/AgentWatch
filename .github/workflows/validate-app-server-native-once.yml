name: Validate Native Codex App Server Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/validate-app-server-native-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Assemble App Server client
        run: cat .github/app-server-chunks/*.part > src/app_server.rs

      - name: Wire CLI and docs
        shell: python
        run: |
          from pathlib import Path

          main = Path("src/main.rs")
          text = main.read_text()
          text = text.replace("mod agent;\n", "mod agent;\nmod app_server;\n", 1)

          codex_variant = '''    /// Run Codex non-interactively through `codex exec` and record it as an agent event.\n    Codex {\n        #[arg(short, long, default_value = ".")]\n        path: PathBuf,\n        #[arg(required = true, trailing_var_arg = true)]\n        args: Vec<String>,\n    },\n'''
          app_variant = codex_variant + '''    /// Run Codex through the native App Server JSON-RPC protocol.\n    #[command(name = "codex-app")]\n    CodexApp {\n        #[arg(short, long, default_value = ".")]\n        path: PathBuf,\n        /// Resume an existing persisted Codex thread instead of starting a new one.\n        #[arg(long)]\n        thread: Option<String>,\n        /// Override the Codex model for this thread/turn.\n        #[arg(short = 'm', long)]\n        model: Option<String>,\n        #[arg(required = true, trailing_var_arg = true)]\n        prompt: Vec<String>,\n    },\n'''
          if codex_variant not in text:
              raise SystemExit("Codex CLI variant marker not found")
          text = text.replace(codex_variant, app_variant, 1)

          codex_match = '        Command::Codex { path, args } => agent::run(&path, CodexProvider, &args),\n'
          app_match = codex_match + '''        Command::CodexApp {\n            path,\n            thread,\n            model,\n            prompt,\n        } => {\n            let prompt = prompt.join(" ");\n            app_server::run(&path, &prompt, thread.as_deref(), model.as_deref())\n        }\n'''
          if codex_match not in text:
              raise SystemExit("Codex CLI match marker not found")
          main.write_text(text.replace(codex_match, app_match, 1))

          readme = Path("README.md")
          docs = readme.read_text()
          marker = "### Approval Gate\n"
          native = '''### Codex App Server-native integration\n\nAgentWatch can run Codex through the same **App Server JSON-RPC protocol** used by rich Codex clients instead of wrapping `codex exec`:\n\n```bash\nagentwatch codex-app -- "Fix the failing tests"\n```\n\nThis mode starts a short-lived local `codex app-server` over stdio, performs the initialize handshake, starts a new persisted Codex thread, starts a turn, and consumes the native event stream until `turn/completed`. Use `--thread THREAD_ID` to resume an existing persisted/idle Codex thread and `--model MODEL` to override the model.\n\nNative App Server events are mapped into AgentWatch's existing run model:\n\n```text\nthread/start or thread/resume\n        │\n        └── turn/start\n              ├── item/started                    -> tool.*.started\n              ├── commandExecution/outputDelta    -> live output\n              ├── item/completed                  -> tool.*.completed / failed\n              ├── approval server requests        -> AgentWatch Approval Gate\n              └── turn/completed                  -> agent.completed / failed\n```\n\nCommand and file approvals are handled through App Server's first-class server requests (`item/commandExecution/requestApproval` and `item/fileChange/requestApproval`). They are routed into the same AgentWatch TUI/terminal approval flow, so this path does **not** need a Codex hook or hook-trust bypass. Unsupported permission-profile, network-only, or unknown server requests fail closed rather than being auto-approved.\n\nEach run also keeps normal AgentWatch worktree attribution/diff artifacts and stores App Server identity metadata under `.agentwatch/runs/<run_id>.app.json` with the Codex `thread_id`, `turn_id`, resolved model, and terminal status.\n\n`agentwatch codex-app` is App Server-native, but it does **not** claim to attach to a turn that is already executing inside an independently launched Codex Desktop process. Cross-client live attachment depends on a shared App Server transport/daemon; the managed daemon lifecycle is currently experimental and Unix-only. `agentwatch codex` remains the portable `codex exec` fallback.\n\n'''
          if marker not in docs:
              raise SystemExit("README Approval Gate marker not found")
          docs = docs.replace(marker, native + marker, 1)

          quick = '''Run Codex through AgentWatch in another terminal:\n\n```bash\nagentwatch codex -- "Fix the failing tests"\n```\n'''
          quick_new = quick + '''\nOr use the App Server-native transport:\n\n```bash\nagentwatch codex-app -- "Fix the failing tests"\n```\n'''
          if quick in docs:
              docs = docs.replace(quick, quick_new, 1)

          row = '| `agentwatch codex -- <args>` | Execute Codex through the provider layer |\n'
          row_new = row + '| `agentwatch codex-app -- <prompt>` | Execute a Codex turn through the native App Server protocol |\n'
          if row in docs:
              docs = docs.replace(row, row_new, 1)

          example = 'agentwatch codex -- -m gpt-5.6-sol "Refactor the parser"\n'
          if example in docs:
              docs = docs.replace(example, example + 'agentwatch codex-app --model gpt-5.6-sol -- "Refactor the parser through App Server"\n', 1)

          readme.write_text(docs)

      - name: Format
        run: cargo fmt --all

      - name: Clippy fix
        run: cargo clippy --fix --all-targets --all-features --allow-dirty --allow-staged -- -D warnings

      - name: Format after fixes
        run: cargo fmt --all

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Remove one-time staging files
        run: |
          rm -rf .github/app-server-chunks
          rm -f .github/workflows/validate-app-server-native-once.yml

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(app-server): add native Codex integration"
          git push
