name: Validate Scoped Hook Trust Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/validate-scoped-hook-trust-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply scoped hook trust patch
        run: python .github/patch_scoped_hook_trust.py

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Commit validated scoped trust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md Cargo.lock
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(security): scope Codex hook trust"
          git push
